<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pedidos quitanda</title>
    <link rel="sylesheet" href="syle.css">
</head>

<body>
    <center>
        <h1>novo pedido</h1>
        <form action="http://localhost:3000" method="post">
            <input type="number" placeholder="indentificação" name="id" required>
            <br><br>
            <input type="text" placeholder="nome do produto" name="nome" required>
            <br><br>

            <select name="unidade" required>
                <option value="kg">kg</option>
                <option value="unidade">unidade</option>
            </select>

            <br><br>

            <input type="number" step="0.01" placeholder="preço unitario" name="preçounitario" required>
                <br><br>

                <button type="reset">limpar</button>
                <button type="reset">enviar</button>
                
        </form>
    </center>

</body>

</html>
