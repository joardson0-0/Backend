<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>restaurante</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <form id="formulario">
        <!--nome do cliente-->
        <label for="nome">Nome do cliente:</label>
        <input type="text" id="nome" name="nome" required>
        
        <br><br>
        <!--escolha lanche-->
        <label for="lanche">Escolha o lanche:</label>
        <select id="lanche"  required>
            <option value="">Selecione um lanche</option>
            <option value="15">hamburguer R$15,00</option>
            <option value="12">X-Salada R$12,00</option>
            <option value="13">X-Bacon R$13,00</option>
    
             </select>

        <br><br>

             <label for="quantidade">Quantidade:</label>
             <input type="number" id="quantidade" min="1" value="1" required>
             
             <br><br>
        
         
        <label for="bebida">Escolha a bebida:</label>
        <select id="bebida" required>
            <option value="0">nenhuma bebida</option>
            <option value="5">refrigerante R$5,00</option>
            <option value="7">Suco R$7,00</option>
       
        </select>

    </form>
    
    
    
    <script src="script.js"></script>
</body>

</html>
